version: '3.8'
services:
  nanoproxy:
    image: ghcr.io/ryanbekhen/nanoproxy:latest
    container_name: nanoproxy
    restart: unless-stopped
    ports:
      - "1080:1080"   # SOCKS5 proxy
      - "8180:8080"   # HTTP proxy (mapped to 8180 to avoid conflict with Go backend on :8080)
    environment:
      ADDR: ":1080"
      ADDR_HTTP: ":8080"
      NO_AUTH_MODE: "true"
      LOG_LEVEL: "info"
